name: MAED Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/et/maed/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cp MainActivity.kt app/src/main/java/et/maed/app/MainActivity.kt
          cp Model.kt app/src/main/java/et/maed/app/Model.kt
          cp Sensor.kt app/src/main/java/et/maed/app/Sensor.kt

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp file_paths.xml app/src/main/res/xml/file_paths.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "et.maed.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "et.maed.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 14
                  versionName = "1.4"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")

              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.core:core-splashscreen:1.0.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Fix Gradle properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MAED APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload MAED APK
        uses: actions/upload-artifact@v4
        with:
          name: maed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
