name: MAED Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/et/maed/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/androidTest/java/et/maed/app

          cp MainActivity.kt app/src/main/java/et/maed/app/MainActivity.kt
          cp Model.kt app/src/main/java/et/maed/app/Model.kt
          cp Sensor.kt app/src/main/java/et/maed/app/Sensor.kt
          cp CameraFoodClassifier.kt app/src/main/java/et/maed/app/CameraFoodClassifier.kt
          cp TargetDetection.kt app/src/main/java/et/maed/app/TargetDetection.kt
          cp MainActivityInstrumentedTest.kt app/src/androidTest/java/et/maed/app/MainActivityInstrumentedTest.kt

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp file_paths.xml app/src/main/res/xml/file_paths.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "et.maed.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "et.maed.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 15
                  versionName = "1.5"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")

              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.core:core-splashscreen:1.0.1")

              debugImplementation("androidx.compose.ui:ui-tooling")

              androidTestImplementation("androidx.test:core:1.6.1")
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("junit:junit:4.13.2")
          }
          EOF

      - name: Fix Gradle properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build MAED APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "MAED APK ready: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"

      - name: Upload MAED APK
        uses: actions/upload-artifact@v4
        with:
          name: maed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
